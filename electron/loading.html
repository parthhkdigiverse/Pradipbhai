<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Creative CRM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 440px;
      padding: 40px;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.15);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      inset: -6px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
      border-radius: 24px;
      filter: blur(12px);
      opacity: 0.6;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.4; filter: blur(10px); transform: scale(0.96); }
      100% { opacity: 0.8; filter: blur(16px); transform: scale(1.04); }
    }

    .logo-img {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      background: #0f172a;
      padding: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 28px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .loader-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 999px;
      animation: indeterminate 1.8s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
    }

    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 40%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }

    .status-text {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .error-box {
      display: none;
      margin-top: 18px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      font-size: 12px;
      color: #fca5a5;
      text-align: left;
      line-height: 1.5;
      -webkit-app-region: no-drag;
    }

    .retry-btn {
      margin-top: 12px;
      padding: 8px 18px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="icon.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
    </div>
    
    <h1>Alpha Creative</h1>
    <div class="subtitle">CRM & ERP Desktop</div>

    <div class="loader-container">
      <div class="loader-bar"></div>
    </div>

    <div class="status-text" id="status">Connecting to Alpha Creative Cloud...</div>

    <div class="error-box" id="errorBox">
      <strong>Unable to connect to cloud server.</strong><br>
      <span id="errorDetails">Please check your internet connection and verify server status at alpha.hkdigiverse.com.</span><br>
      <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
    </div>
  </div>

  <script>
    let attempts = 0;
    const maxAttempts = 50;

    function updateStatus(text) {
      const el = document.getElementById('status');
      if (el) el.innerText = text;
    }

    function showError(msg) {
      document.getElementById('errorBox').style.display = 'block';
      if (msg) document.getElementById('errorDetails').innerText = msg;
      updateStatus('Startup issue detected');
    }

    function retryConnection() {
      document.getElementById('errorBox').style.display = 'none';
      updateStatus('Retrying connection...');
      if (window.electronAPI && window.electronAPI.retry) {
        window.electronAPI.retry();
      } else {
        location.reload();
      }
    }

    // Listen for status updates from Electron main process if available
    if (window.electronAPI && window.electronAPI.onStatus) {
      window.electronAPI.onStatus((status) => {
        updateStatus(status);
      });
      window.electronAPI.onError((err) => {
        showError(err);
      });
    }
  </script>
</body>
</html>
